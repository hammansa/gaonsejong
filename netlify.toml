[build]
  # Publish the project root so Netlify serves the existing static HTML files.
  # Change this if you have a build step that outputs to a different folder.
  publish = "."
  # No build command required for static site in repository. Set a command
  # (e.g., "npm run build") if you add a build step that generates output.
  command = ""

[context.production.environment]
  # Example: pin Node version if any build steps rely on node
  NODE_VERSION = "18"
