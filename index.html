<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>노가다뉴스 | 노동의 가치를 다함께</title>
  <meta property="og:type" content="website" />
  <meta property="og:title" content="노가다뉴스" />
  <meta property="og:description" content="노력하는 사람들의 가치 있는 땀방울로 다 함께 만드는 세상" />
  <meta property="og:image" content="assets/worker.jpg" /> <link rel="stylesheet" href="style.css" />
  <style>
    /* 노가다뉴스 스타일 유지 및 뉴스룸 최적화 */
    .newsroom-layout { display: flex; flex-direction: column; gap: 20px; margin-top: 24px; }
    .ticker-bar { display: flex; align-items: center; padding: 10px 15px; border-radius: 10px; gap: 12px; height: 44px; }
    .ticker-label { background: #f39c12; color: #fff; padding: 2px 8px; border-radius: 4px; font-weight: 800; font-size: 11px; } /* 안전색 오렌지 적용 */
    .ticker-content { flex: 1; height: 20px; overflow: hidden; }
    #tickerList { list-style: none; padding: 0; margin: 0; animation: ticker-v 12s infinite; }
    #tickerList li { line-height: 20px; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); }
    .main-news-grid { display: grid; grid-template-columns: 1.6fr 1fr; gap: 20px; }
    .hero-box { padding: 0; overflow: hidden; display: flex; flex-direction: column; text-decoration: none; color: inherit; transition: transform 0.3s; }
    .hero-box:hover { transform: translateY(-4px); }
    .hero-img-area { width: 100%; height: 300px; overflow: hidden; }
    .hero-img-area img { width: 100%; height: 100%; object-fit: cover; }
    .hero-txt-area { padding: 20px; }
    .hero-main-title { font-size: 24px; margin: 8px 0; line-height: 1.3; font-weight: 800; }
    .hero-main-excerpt { color: var(--muted); font-size: 15px; margin-bottom: 12px; line-height: 1.5; }
    .side-box { padding: 20px; display: flex; flex-direction: column; }
    .side-head { font-weight: 800; border-bottom: 2px solid #f39c12; padding-bottom: 8px; margin-bottom: 12px; font-size: 18px; }
    .side-item { padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.08); display: block; text-decoration: none; color: inherit; transition: color 0.2s; }
    .side-item:hover .side-item-title { color: #f39c12; }
    .side-item-title { font-size: 15px; font-weight: 600; line-height: 1.4; }
    @keyframes ticker-v {
      0%, 20% { transform: translateY(0); }
      25%, 45% { transform: translateY(-20px); }
      50%, 70% { transform: translateY(-40px); }
      75%, 95% { transform: translateY(-60px); }
      100% { transform: translateY(0); }
    }
    @media (max-width: 992px) { .main-news-grid { grid-template-columns: 1fr; } .hero-img-area { height: 220px; } }
  </style>
</head>
<body class="page-home">
  <div class="space-video" aria-hidden="true">
    <video class="space-video__el" autoplay muted playsinline loop preload="auto" aria-hidden="true" tabindex="-1">
      <source src="assets/space-warp.mp4" type="video/mp4" />
    </video>
  </div>

  <div class="universe" aria-hidden="true">
    <script>
      // XSS 방지용 최소 escape
      const esc = (s) => (s ?? "").toString().replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));

      // 카테고리 → 기본 썸네일 자동 매핑
      function normalizeCategory(cat){ return (cat ?? "").toString().trim(); }
      function getCategoryCoverMap(){
        return {
          "창간특집": "assets/thumbs/launch.jpg",
          "권익보호": "assets/thumbs/rights.jpg",
          "현장소식": "assets/thumbs/site.jpg",
          "취재수첩": "assets/thumbs/notebook.jpg",
          "인터뷰": "assets/thumbs/interview.jpg",
          "칼럼": "assets/thumbs/column.jpg",
          "속보": "assets/thumbs/breaking.jpg"
        };
      }
      function getCover(article){
        if (article && article.cover) return article.cover;
        const cat = normalizeCategory(article?.category);
        const map = getCategoryCoverMap();
        if (cat && map[cat]) return map[cat];
        return "assets/worker.jpg";
      }

      async function renderLatest3(){
        const grid = document.getElementById("latest3Grid");
        try{
          const res = await fetch("news.json", { cache: "no-store" });
          if(!res.ok) throw new Error("news.json not found");
          const data = await res.json();
          const articles = (data.articles || []).slice(0, 3);
          if(!articles.length){ grid.innerHTML = '<div class="muted">게시된 기사가 없습니다.</div>'; return; }

          grid.innerHTML = articles.map(a => `
            <a class="latest3-card glass" href="article.html?id=${encodeURIComponent(a.id)}">
              <div class="latest3-thumb">
                <img src="${esc(getCover(a))}" alt="" loading="lazy" />
              </div>
              <div class="latest3-body">
                <div class="latest3-meta">
                  <span class="latest3-cat">${esc(a.category)}</span>
                  <span class="latest3-dot">•</span>
                  <span class="latest3-date">${esc(a.date)}</span>
                  <span class="latest3-dot">•</span>
                  <span class="latest3-read">${esc(a.readTime)}</span>
                </div>
                <h3 class="latest3-title">${esc(a.title)}</h3>
                <p class="latest3-excerpt">${esc(a.excerpt)}</p>
                <div class="latest3-cta">
                  <span class="btn btn-ghost btn-sm">기사 읽기 →</span>
                </div>
              </div>
            </a>
          `).join("");
        }catch(e){ console.error(e); grid.innerHTML = '<div class="muted">최신 뉴스를 불러오지 못했습니다.</div>'; }
      }

      async function main() {
        try {
          const res = await fetch("news.json", { cache: "no-store" });
          const data = await res.json();
          const articles = data.articles || [];

          const ticker = document.getElementById("tickerList");
          ticker.innerHTML = articles.slice(0, 4).map(a => `<li>${esc(a.title)}</li>`).join("");

          if (articles[0]) {
            const hero = articles[0];
            document.getElementById("mainHeroLink").href = `article.html?id=${encodeURIComponent(hero.id)}`;
            document.getElementById("mainHeroCat").textContent = esc(hero.category);
            document.getElementById("mainHeroTitle").textContent = esc(hero.title);
            document.getElementById("mainHeroExcerpt").textContent = esc(hero.excerpt);
            document.getElementById("mainHeroMeta").textContent = `${esc(hero.date)} · ${esc(hero.readTime)}`;
            const mainImg = document.getElementById("mainHeroImg");
            if (mainImg) { mainImg.src = getCover(hero); mainImg.alt = esc(hero.title || '주요 기사 이미지'); }
          }

          const sideList = document.getElementById("sideNewsList");
          sideList.innerHTML = articles.slice(1, 5).map(a => `
            <a href="article.html?id=${encodeURIComponent(a.id)}" class="side-item">
              <div class="universe" aria-hidden="true"></div>
              <div style="font-size:12px; color:var(--muted);" id="mainHeroMeta">--</div>
            </div>
          </a>
          <div class="side-box glass">
            <div class="side-head">현장 이슈 리스트</div>
            <div id="sideNewsList"></div>
          </div>
        </div>
      </div>
    </section>

    <section class="section" id="contact">
      <div class="glass contact">
        <h2 class="section-title">부당 대우 제보 및 상담</h2>
        <a class="btn btn-kakao btn-xl" href="https://open.kakao.com/0/gYojhMci" target="_blank" rel="noopener noreferrer">익명 카톡 제보하기</a>
      </div>
    </section>

  </main>

    <footer class="site-footer">
      <div class="footer-inner">
        <div class="muted">© 2026 NOGADA NEWS. All Rights Reserved.</div>
        <div class="muted">발행인 : 박 상 현</div>
        <div class="muted">지주회사 : (주)누리온홀딩스</div>
      </div>
    </footer>

  <script>
    const esc = (s) => (s ?? "").toString().replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));

    async function main() {
      try {
        const res = await fetch("news.json", { cache: "no-store" });
        const data = await res.json();
        const articles = data.articles || [];

        const ticker = document.getElementById("tickerList");
        ticker.innerHTML = articles.slice(0, 4).map(a => `<li>${esc(a.title)}</li>`).join("");

        if (articles[0]) {
          const hero = articles[0];
          document.getElementById("mainHeroLink").href = `article.html?id=${encodeURIComponent(hero.id)}`;
          document.getElementById("mainHeroCat").textContent = esc(hero.category);
          document.getElementById("mainHeroTitle").textContent = esc(hero.title);
          document.getElementById("mainHeroExcerpt").textContent = esc(hero.excerpt);
          document.getElementById("mainHeroMeta").textContent = `${esc(hero.date)} · ${esc(hero.readTime)}`;
          // Set hero image from cover (cover > category mapping > worker.jpg)
          const mainImg = document.getElementById("mainHeroImg");
          if (mainImg) {
            mainImg.src = getCover(hero);
            mainImg.alt = esc(hero.title || '주요 기사 이미지');
          }
        }

        const sideList = document.getElementById("sideNewsList");
        sideList.innerHTML = articles.slice(1, 5).map(a => `
          <a href="article.html?id=${encodeURIComponent(a.id)}" class="side-item">
            <div class="side-item-title">${esc(a.title)}</div>
            <div style="font-size:11px; color:var(--muted); margin-top:4px;">${esc(a.date)}</div>
          </a>
        `).join("");
      } catch (e) { console.error(e); }
    }
    main();
  </script>
</body>
</html>
