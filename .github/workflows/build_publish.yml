name: Build nogadanews_publish

on:
  push:
    branches:
      - main
      - 'publish/**'

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Run build_publish script
        run: node ./scripts/build_publish.js

      - name: Commit nogadanews_publish (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add nogadanews_publish || true
          if ! git diff --staged --quiet; then
            git commit -m "chore(publish): build nogadanews_publish [skip ci]"
            git push
          else
            echo "No changes to commit"
          fi
