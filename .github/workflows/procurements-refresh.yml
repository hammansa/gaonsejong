name: Refresh Procurements Feed

on:
  schedule:
    - cron: '0 3 * * *' # daily at 03:00 UTC (adjust as needed)
  workflow_dispatch: {}

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run fetch script
        run: |
          python scripts/fetch_procurements.py

      - name: Create Pull Request with updated data
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(procurements): refresh feed"
          branch: "auto/procurements-refresh"
          title: "Auto: Refresh procurements feed"
          body: |
            This PR was created automatically by the scheduled workflow to refresh `data/procurements.json`.
          labels: automated
